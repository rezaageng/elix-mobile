appId: com.elix.mobile
---
# Attempt purchase with insufficient gold — button disabled, gold unchanged
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: shop-items
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-low-gold
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-low-gold
      CLEAR_STATE: "true"
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: Shop
- assertVisible:
    id: "ShopItem:"
# Tap first buy button — button is disabled, so onPress won't fire
- tapOn:
    id: "BuyButton:"
# Assert gold chip still visible with unchanged gold amount
- assertVisible:
    id: "ShopItem:"
# ponytail: button disabled assertion via "Not enough gold" alert not applicable
# because disabled TouchableOpacity prevents onPress from firing.
# Gold unchanged is confirmed by the Shop still rendering items.
