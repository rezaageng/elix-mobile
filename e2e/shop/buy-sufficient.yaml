appId: com.elix.mobile
---
# Purchase an item with sufficient gold, verify it appears in inventory
- runFlow:
    file: ../shared/auth.yaml
    env:
      SEED_KEY: with-class
- extendedWaitUntil:
    visible: "Quest"
    timeout: 15000
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: Shop
- assertVisible:
    id: "ShopItem:"
# Tap first buy button
- tapOn:
    id: "BuyButton:"
# Dismiss purchase success alert (native Alert.alert with "OK" button)
- tapOn:
    text: "OK"
# Navigate to Inventory tab
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: Inventory
# Assert the purchased item appears in inventory
- assertVisible:
    id: "InventoryItem:"
