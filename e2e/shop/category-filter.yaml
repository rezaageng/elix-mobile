appId: com.elix.mobile
---
# Category filter: each filter shows items for that category
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: shop-items
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-with-class
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-with-class
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: Shop
- assertVisible:
    id: "ShopFilterAll"
# Filter to Consumables
- tapOn:
    id: "ShopFilterConsumables"
- assertVisible:
    id: "ShopFilterConsumables"
- assertVisible:
    id: "ShopItem:"
# Filter to Boosts
- tapOn:
    id: "ShopFilterBoosts"
- assertVisible:
    id: "ShopFilterBoosts"
- assertVisible:
    id: "ShopItem:"
# Filter back to All
- tapOn:
    id: "ShopFilterAll"
- assertVisible:
    id: "ShopFilterAll"
- assertVisible:
    id: "ShopItem:"
