appId: com.elix.mobile
---
# Smoke test: Shop tab loads with items displayed
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: shop-items
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-with-class
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-with-class
      CLEAR_STATE: "true"
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: Shop
- assertVisible:
    id: "ShopFilterAll"
- assertVisible:
    id: "ShopItem:"
- assertVisible:
    text: "Shop"
