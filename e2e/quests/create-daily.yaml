appId: com.elix.mobile
---
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-with-class
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-with-class
- tapOn:
    id: "FilterDaily"
- tapOn:
    id: "CreateQuestButton"
- runFlow:
    file: ../shared/form.yaml
    env:
      FIELD_ID: QuestTitleInput
      VALUE: "E2E Daily"
- runFlow:
    file: ../shared/form.yaml
    env:
      FIELD_ID: QuestDescriptionInput
      VALUE: "Daily desc"
- tapOn:
    id: "CreateQuest"
- assertVisible:
    id: "QuestCard:E2E Daily"
