appId: com.elix.mobile
---
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: quests-full
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-with-class
      CLEAR_STATE: "true"
- tapOn:
    id: "FilterMain"
- assertVisible:
    id: "QuestCard:"
- tapOn:
    id: "FilterDaily"
- assertVisible:
    id: "QuestCard:"
- tapOn:
    id: "FilterAll"
- assertVisible:
    id: "QuestCard:"
