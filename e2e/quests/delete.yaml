appId: com.elix.mobile
---
- runFlow:
    file: ../shared/auth.yaml
    env:
      SEED_KEY: quests-full
- extendedWaitUntil:
    visible: "Quest"
    timeout: 15000
- longPressOn:
    id: "QuestCard:"
- tapOn:
    text: "Delete Quest"
- runFlow:
    file: ../shared/alert.yaml
    env:
      BUTTON: "Delete"
- assertNotVisible:
    id: "QuestCard:"
