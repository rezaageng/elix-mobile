appId: com.elix.mobile
---
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: quests-full
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-with-class
- tapOn:
    id: "QuestCard:"
- tapOn:
    id: "QuestSubmitButton"
- assertVisible:
    id: "VerificationTextInput"
- tapOn:
    id: "VerificationTextInput"
- inputText: "reject"
- tapOn:
    id: "VerificationSubmitButton"
- assertVisible: "Submission Rejected"
