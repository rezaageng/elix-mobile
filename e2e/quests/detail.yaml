appId: com.elix.mobile
---
- runFlow:
    file: ../shared/auth.yaml
    env:
      SEED_KEY: quests-full
- extendedWaitUntil:
    visible: "Quest"
    timeout: 15000
- tapOn:
    id: "QuestCard:"
- assertVisible:
    id: "QuestDetailScreen"
- assertVisible:
    id: "QuestSubmitButton"
- tapOn:
    point: "5%,5%"
