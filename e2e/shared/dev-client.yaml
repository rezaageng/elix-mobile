appId: "${APP_ID}"
---
# Dismiss the Expo dev-client launcher and developer menu when running E2E
# against a development build. This is a no-op for release builds.
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 10000
    optional: true
- tapOn:
    text: "http://localhost:8081"
    optional: true
- extendedWaitUntil:
    visible: "Close"
    timeout: 30000
    optional: true
- tapOn:
    text: "Close"
    optional: true
