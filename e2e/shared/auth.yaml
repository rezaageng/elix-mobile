appId: com.elix.mobile
---
# Dev-only email/password sign-in. The email/password provider is enabled on
# the backend only in development. Social OAuth is not automatable in Maestro,
# so E2E tests use this form to establish a real Better Auth session.
- runScript:
    file: ../scripts/sign-in.js
    env:
      USER_ID: "${USER_ID}"
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"
- launchApp:
    clearState: ${CLEAR_STATE:-false}
- extendedWaitUntil:
    visible: "Welcome to Elix"
    timeout: 10000
- tapOn:
    id: "DevEmailInput"
- inputText: "${output.email}"
- tapOn:
    id: "DevPasswordInput"
- inputText: "${output.password}"
- tapOn:
    id: "DevSignInButton"
- extendedWaitUntil:
    notVisible: "Welcome to Elix"
    timeout: 15000
