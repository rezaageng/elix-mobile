appId: com.elix.mobile
---
# Manual auth helper.
# 1. Seeds the configured E2E OAuth account on the backend before sign-in.
# 2. Launches the app fresh and waits for the login screen.
# 3. The test user then has 10 minutes to sign in via Google/Twitter.
# The calling test must wait for its expected post-auth screen (Quest tab or Roles).
- runScript:
    file: ../scripts/seed.js
    env:
      SEED_KEY: "${SEED_KEY}"
      API_URL: "${EXPO_PUBLIC_API_URL}"
      E2E_TEST_EMAIL: "${E2E_TEST_EMAIL}"
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome to Elix"
    timeout: 10000
