appId: com.elix.mobile
---
# Tier 6: Profile — view another user's profile from guild
- runFlow:
    file: ../shared/auth.yaml
    env:
      SEED_KEY: guild-member
- extendedWaitUntil:
    visible: "Quest"
    timeout: 15000
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: "Guild"
- tapOn:
    text: "Members"
- tapOn:
    id: "MemberRow"
    index: 1
- assertVisible:
    id: "UserProfileName"
- assertNotVisible:
    id: "EditProfileButton"
