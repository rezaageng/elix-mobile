appId: com.elix.mobile
---
# Tier 6: Profile — edit display name
- runFlow:
    file: ../shared/auth.yaml
    env:
      SEED_KEY: with-class
- extendedWaitUntil:
    visible: "Quest"
    timeout: 15000
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: "Profile"
- tapOn:
    id: "EditProfileButton"
- tapOn:
    id: "ProfileNameInput"
- inputText: "E2E New Name"
- tapOn:
    id: "SaveProfileButton"
- assertVisible: "E2E New Name"
