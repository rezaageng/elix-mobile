appId: com.elix.mobile
---
# Use a Deadline Extension item on a quest in progress
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-with-class
      SEED_PARAMS: '{"inventory": ["deadline_extension"], "quests": [{"name": "Quest 1", "status": "in_progress"}]}'
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-with-class
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: Inventory
- assertVisible:
    id: "UseButton:"
# Tap the first Use button
- tapOn:
    id: "UseButton:"
# Native alert: "Extend Deadline" with quest buttons; tap the quest name
- tapOn:
    text: "Quest 1"
# Success alert: "Item used" with "OK" button
- tapOn:
    text: "OK"
