appId: com.elix.mobile
---
# Inventory shows items and use buttons when user has items
- runFlow:
    file: ../shared/auth.yaml
    env:
      SEED_KEY: with-class
- extendedWaitUntil:
    visible: "Quest"
    timeout: 15000
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: Inventory
- assertVisible:
    id: "InventoryItem:"
- assertVisible:
    id: "UseButton:"
