appId: com.elix.mobile
---
# Inventory shows items and use buttons when user has items
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-with-class
      SEED_PARAMS: '{"inventory": ["restore_streak", "deadline_extension"]}'
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-with-class
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: Inventory
- assertVisible:
    id: "InventoryItem:"
- assertVisible:
    id: "UseButton:"
