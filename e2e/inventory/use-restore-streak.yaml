appId: com.elix.mobile
---
# Use a Restore Streak item on a user with a broken streak
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-with-class
      SEED_PARAMS: '{"inventory": ["restore_streak"], "restorableStreak": 5}'
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-with-class
      CLEAR_STATE: "true"
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: Inventory
- assertVisible:
    id: "UseButton:"
# Tap the first Use button
- tapOn:
    id: "UseButton:"
# Native alert: "Restore Streak" with ["Cancel", "Restore"] buttons
- tapOn:
    text: "Restore"
# Success alert: "Streak restored" with "OK" button
- tapOn:
    text: "OK"
