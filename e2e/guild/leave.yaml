appId: com.elix.mobile
---
# Guild Leave: seed a guild member, leave guild and land on discovery
- runFlow:
    file: ../shared/auth.yaml
    env:
      SEED_KEY: guild-member
- extendedWaitUntil:
    visible: "Quest"
    timeout: 15000
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: "Guild"
- tapOn:
    id: "LeaveGuildButton"
- runFlow:
    file: ../shared/alert.yaml
    env:
      BUTTON: "Leave"
- assertVisible:
    id: "GuildSearchInput"
