appId: com.elix.mobile
---
# Guild Home (Member): seed a guild member, verify member-visible controls
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-guild-member
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-guild-member
      CLEAR_STATE: "true"
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: "Guild"
- assertVisible:
    id: "GuildChatButton"
- assertVisible:
    id: "GuildMembersButton"
- assertVisible:
    id: "GuildLeaderboardButton"
- assertNotVisible:
    id: "DeleteGuildButton"
