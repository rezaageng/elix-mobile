appId: com.elix.mobile
---
# Guild Chat: seed a guild member, send a chat message and verify it appears
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-guild-member
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-guild-member
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: "Guild"
- tapOn:
    id: "GuildChatButton"
- tapOn:
    id: "ChatInput"
- inputText: "Hello from Maestro"
- tapOn:
    id: "ChatSendButton"
- assertVisible: "Hello from Maestro"
