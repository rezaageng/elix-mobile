appId: com.elix.mobile
---
# Tier 2: Logout from profile settings redirects to login screen

- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-with-class
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-with-class
      CLEAR_STATE: "true"
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: "Profile"
- tapOn:
    id: "SettingsButton"
- tapOn:
    id: "LogoutButton"
- tapOn:
    text: "Log Out"
- assertVisible: "Welcome to Elix"
