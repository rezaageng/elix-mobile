appId: com.elix.mobile
---
# Tier 6: Profile — view another user's profile from guild
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: guild-full
- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-guild-member
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-guild-member
- runFlow:
    file: ../shared/navigate.yaml
    env:
      TAB: "Guild"
- tapOn:
    text: "Members"
- tapOn:
    id: "MemberRow"
    index: 1
- assertVisible:
    id: "UserProfileName"
- assertNotVisible:
    id: "EditProfileButton"
