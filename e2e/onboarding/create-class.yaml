appId: com.elix.mobile
---
# Tier 2: Create a custom class with full quest setup (main → side → recurring)

- runFlow:
    file: ../shared/seed.yaml
    env:
      SEED_KEY: user-no-class
- runFlow:
    file: ../shared/auth.yaml
    env:
      USER_ID: e2e-user-no-class
- tapOn:
    id: "CreateCustomRole"
- runFlow:
    file: ../shared/form.yaml
    env:
      FIELD_ID: RoleNameInput
      VALUE: "E2E Test Role"
- runFlow:
    file: ../shared/form.yaml
    env:
      FIELD_ID: RoleDescriptionInput
      VALUE: "Test description"
- tapOn:
    id: "CreateRole"
# Main quest screen
- runFlow:
    file: ../shared/form.yaml
    env:
      FIELD_ID: QuestTitleInput
      VALUE: "E2E Main Quest"
- runFlow:
    file: ../shared/form.yaml
    env:
      FIELD_ID: QuestDescriptionInput
      VALUE: "Main quest description"
- tapOn:
    id: "CreateQuest"
# Side quest screen
- runFlow:
    file: ../shared/form.yaml
    env:
      FIELD_ID: QuestTitleInput
      VALUE: "E2E Side Quest"
- runFlow:
    file: ../shared/form.yaml
    env:
      FIELD_ID: QuestDescriptionInput
      VALUE: "Side quest description"
- tapOn:
    id: "CreateQuest"
# Recurring quest screen (daily section)
- runFlow:
    file: ../shared/form.yaml
    env:
      FIELD_ID: QuestTitleInput
      VALUE: "E2E Recurring Quest"
- runFlow:
    file: ../shared/form.yaml
    env:
      FIELD_ID: QuestDescriptionInput
      VALUE: "Recurring quest description"
- tapOn:
    id: "CreateQuest"
- assertVisible: "Quest"
